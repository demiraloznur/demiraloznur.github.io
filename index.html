<!DOCTYPE html>
<html lang="tr" class="no-js">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Öznur Demiral — Junior yazılım geliştirici</title>
    <script>
      (function () {
        var d = document.documentElement, t = null;
        d.className = d.className.replace('no-js', 'js');
        try { t = localStorage.getItem('tema'); } catch (e) {}
        if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        d.dataset.theme = t;
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap">
    <link rel="stylesheet" href="css/style.css">
    <script type="module" src="js/main.js"></script>
  </head>
  <body>
    <a class="atla" href="#icerik">İçeriğe geç</a>

    <header class="ust-bar">
      <a class="marka" href="#ust">Öznur Demiral</a>
      <nav aria-label="Bölümler">
        <ul class="menu">
          <li><a href="#hakkimda">Hakkımda</a></li>
          <li><a href="#yolculuk">Yolculuk</a></li>
          <li><a href="#beceriler">Beceriler</a></li>
          <li><a href="#projeler">Projeler</a></li>
          <li><a href="#iletisim">İletişim</a></li>
        </ul>
      </nav>
      <button class="tema-dugmesi" type="button" aria-pressed="false" aria-label="Koyu temaya geç">
        <svg class="ikon-ay" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/></svg>
        <svg class="ikon-gunes" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </header>

    <main id="icerik">
      <section id="ust" class="bolum bolum--ust" aria-label="Tanıtım">
      </section>

      <section id="hakkimda" class="bolum" aria-labelledby="hakkimda-baslik">
        <h2 id="hakkimda-baslik" class="bolum-baslik">Hakkımda</h2>
      </section>

      <section id="yolculuk" class="bolum" aria-labelledby="yolculuk-baslik">
        <h2 id="yolculuk-baslik" class="bolum-baslik">Yolculuk</h2>
      </section>

      <section id="beceriler" class="bolum" aria-labelledby="beceriler-baslik">
        <h2 id="beceriler-baslik" class="bolum-baslik">Beceriler</h2>
      </section>

      <section id="projeler" class="bolum" aria-labelledby="projeler-baslik">
        <h2 id="projeler-baslik" class="bolum-baslik">Projeler</h2>
      </section>

      <section id="iletisim" class="bolum" aria-labelledby="iletisim-baslik">
        <h2 id="iletisim-baslik" class="bolum-baslik">İletişim</h2>
      </section>
    </main>

    <footer class="alt-bilgi">
      <p>© 2026 Öznur Demiral · Bursa</p>
    </footer>
  </body>
</html>
